# Nightly regression: everything too slow, too flaky-by-nature or too infrastructure-heavy for every PR.
# Results are informational (the PR quality gate is the merge blocker). Failures here open a triage task.
name: Nightly full regression

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  MAVEN_ARGS: -B -ntp
  NIGHTLY_FLAGS: -DtestFailureIgnore=true -Dheadless=true -Dretry.count=1

jobs:
  cross-browser-matrix:
    name: Cross-browser matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]   # macOS adds Safari/WebKit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Enable safaridriver (macOS only)
        if: runner.os == 'macOS'
        run: sudo safaridriver --enable
      - name: Full browser x viewport x device matrix
        # -Dsuite only exists in 02, so build upstream modules without running their tests
        run: |
          ./mvnw $MAVEN_ARGS -q -pl 02-cross-browser-ui -am install -DskipTests
          ./mvnw $MAVEN_ARGS -pl 02-cross-browser-ui verify $NIGHTLY_FLAGS -DexcludedGroups=known-defect -Dsuite=testng-matrix.xml
      - run: .github/scripts/stage-results.sh 02-cross-browser-ui
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-matrix-${{ matrix.os }}
          path: ci-results
          retention-days: 14

  known-defects:
    name: Known-defect tracking (expected failures)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A known defect that suddenly PASSES means it was fixed upstream: the test should move out of the group.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: 03-api-testing/package-lock.json }
      - name: Run only group=known-defect
        run: >
          ./mvnw $MAVEN_ARGS -pl 02-cross-browser-ui,03-api-testing,04-e2e-framework,07-accessibility -am verify
          $NIGHTLY_FLAGS -Dgroups=known-defect
      - name: Newman "Known defects" folder
        working-directory: 03-api-testing
        run: npm ci && (npm run test:defects || true)
      - run: .github/scripts/stage-results.sh 02-cross-browser-ui 03-api-testing 04-e2e-framework 07-accessibility
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: nightly-known-defects, path: ci-results, retention-days: 30 }

  perf-full:
    name: Performance (load, stress, spike, endurance)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: ./mvnw $MAVEN_ARGS -pl 05-performance -am verify -DtestFailureIgnore=true -Dperf.profile=full
      - run: .github/scripts/stage-results.sh 05-performance
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: nightly-perf, path: ci-results, retention-days: 30 }

  dependency-scan:
    name: Dependency vulnerability scan (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - name: Scan
        env:
          # Free key from https://nvd.nist.gov/developers/request-an-api-key — stored as a repository secret
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash 06-security-qa/scripts/dependency-scan.sh
      - run: .github/scripts/stage-results.sh 06-security-qa
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: nightly-dependency-scan, path: ci-results, retention-days: 30 }

  mobile:
    name: Mobile (Appium on Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true   # emulators on shared runners are slow/unstable; never blocks anything
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Appium 2 + UiAutomator2 driver
        run: |
          npm install -g appium@2
          appium driver install uiautomator2
      - name: Pre-build test module
        run: ./mvnw $MAVEN_ARGS -q -pl 09-mobile -am install -DskipTests
      - name: Run mobile suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            nohup appium --relaxed-security --address 127.0.0.1 --port 4723 --log 09-mobile/appium.log > /dev/null 2>&1 &
            sleep 10
            ./mvnw -B -ntp -pl 09-mobile verify -DtestFailureIgnore=true -Dappium.url=http://127.0.0.1:4723
      - name: Keep Appium log
        if: always()
        run: mkdir -p 09-mobile/target && cp 09-mobile/appium.log 09-mobile/target/ || true
      - run: .github/scripts/stage-results.sh 09-mobile
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: nightly-mobile, path: ci-results, retention-days: 14 }

  nightly-summary:
    name: Nightly summary (informational gate)
    needs: [cross-browser-matrix, perf-full, dependency-scan, mobile]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: ./mvnw $MAVEN_ARGS -q -pl 10-quality-gate -am package -DskipTests
      # known-defect results are deliberately NOT included: they are expected to fail
      - uses: actions/download-artifact@v4
        with: { pattern: "nightly-*", path: results }
      - run: rm -rf results/nightly-known-defects
      - name: Evaluate (informational)
        continue-on-error: true
        run: >
          java -jar 10-quality-gate/target/10-quality-gate-1.0.0.jar --root results
          --config 10-quality-gate/quality-gate.properties
          --set gate.requiredModules=02-cross-browser-ui,05-performance
          --set gate.maxSkippedPercent=50
          --out quality-gate
