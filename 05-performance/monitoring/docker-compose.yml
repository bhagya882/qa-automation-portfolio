# Local observability stack for load tests against the OWNED Demo Store.
# Prereq: build the app jar first:  ./mvnw -pl sample-app -am package -DskipTests   (from repo root)
# Start:  docker compose -f 05-performance/monitoring/docker-compose.yml up -d --build
# Load:   ./mvnw -pl 05-performance test -Dperf.baseUrl=http://localhost:7070 [-Dperf.profile=full]
# View:   Grafana http://localhost:3000 (anonymous viewer) -> "Demo Store - Load Test"; Prometheus http://localhost:9090
# STATUS: not executed in the authoring environment (Docker unavailable) — see ../README.md "Known limitations".
name: demostore-perf

services:
  demo-store:
    build:
      context: ../../sample-app
      dockerfile: Dockerfile
    environment:
      PORT: "7070"
      APP_MODE: secure
    ports:
      - "7070:7070"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/7070' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - demo-store

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Set GRAFANA_ADMIN_PASSWORD in your shell or a local .env (git-ignored); never commit it
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-locally}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
