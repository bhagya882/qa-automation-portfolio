# Base defaults for 05-performance. Profile files in perf/<profile>.properties override these.
# Target: leave perf.baseUrl empty to start the owned Demo Store in-process on perf.port.
perf.baseUrl=
perf.port=7080

# ---- SLOs (per sampler label overrides: perf.threshold.p95Ms.<label>) ----
perf.threshold.errorRatePct=1.0
perf.threshold.p95Ms=300
perf.threshold.p99Ms=800
perf.threshold.p95Ms.sales_report=500
perf.threshold.p99Ms.sales_report=1000
perf.threshold.minRps=5

# Spike allows degraded latency but no errors
perf.spike.p95Ms=800
perf.spike.p99Ms=1500
perf.spike.p95Ms.sales_report=1500
perf.spike.p99Ms.sales_report=2500
perf.spike.errorRatePct=1.0

# Labels excluded from the stress "core endpoints" check (tracked separately as PERF-001)
perf.stress.excludeLabels=sales_report

retry.count=0
