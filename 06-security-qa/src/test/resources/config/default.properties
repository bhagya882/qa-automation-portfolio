# 06-security-qa. Leave security.baseUrl empty to start the OWNED Demo Store in-process.
# Only point security.baseUrl at systems you own or are explicitly authorised to test.
security.baseUrl=
security.port.secure=7090
security.port.insecure=7091
# Demo-lab accounts of the owned sample-app (synthetic, local only). Override via env DEMO_CUSTOMER_PASSWORD / DEMO_ADMIN_PASSWORD.
security.user1=customer1
security.user2=customer2
security.admin=admin
retry.count=0
