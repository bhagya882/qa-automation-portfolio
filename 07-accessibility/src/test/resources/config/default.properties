# 07-accessibility defaults (override with -Dkey=value or env var KEY_NAME)
base.url=https://www.saucedemo.com
browser=chrome
headless=true
timeout.explicit=10
timeout.pageLoad=30
retry.count=0
# Public demo account published on the SauceDemo login page (not a secret)
sauce.user=standard_user
sauce.password=secret_sauce
# WCAG tags passed to axe-core
axe.tags=wcag2a,wcag2aa,wcag21a,wcag21aa,wcag22aa,best-practice
