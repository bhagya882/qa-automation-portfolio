# Local PostgreSQL target for the migration suite:
#   docker compose -f 08-db-migration/docker-compose.yml up -d
#   ./mvnw -pl 08-db-migration test -Ddb.url=jdbc:postgresql://localhost:5432/qa -Ddb.user=qa -Ddb.password=$DB_PASSWORD
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: qa
      POSTGRES_USER: qa
      # Local throwaway container only; override with an env var, never commit real passwords
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qa_local_only}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d qa"]
      interval: 5s
      retries: 10
