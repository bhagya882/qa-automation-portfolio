# 09-mobile defaults. Override with -Dkey=value or env (APPIUM_URL, DEVICE_NAME, ...)
# platform: android | ios
platform=android
appium.url=http://127.0.0.1:4723
device.name=emulator-5554
# Leave empty to let UiAutomator2 use whatever is connected
platform.version=
app.path=apps/my-demo-app-android.apk
app.package=com.saucelabs.mydemoapp.android
app.activity=.view.activities.SplashActivity
# Reuse the installed app between tests (faster); tests reset state explicitly
no.reset=false
timeout.explicit=15
retry.count=0
# Demo account published inside My Demo App's own login screen (not a secret)
mda.user=bod@example.com
mda.password=10203040

# iOS (XCUITest) - only used with -Dplatform=ios
ios.device.name=iPhone 16
ios.platform.version=
ios.app.path=apps/MyDemoApp.app
ios.bundle.id=com.saucelabs.mydemo.app.ios

# BrowserStack - activated when BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY env vars are set
# (upload the APK first and pass its bs:// id via BROWSERSTACK_APP)
browserstack.device=Google Pixel 8
browserstack.os.version=14.0
