# Quality gate thresholds — the single source of truth for "is this build releasable?"
# Change via pull request only (reviewed like code). CLI override: --set key=value

# Overall pass rate across all executed tests: passed / (passed + failed) * 100
gate.minPassRate=100

# Max failed tests allowed per module (per-module override: gate.maxFailures.<module>=N)
gate.maxFailuresPerModule=0

# Max share of tests that may be skipped/blocked per module (%). Above this, infrastructure is likely broken.
gate.maxSkippedPercent=20

# Tests that failed first and passed on retry (RetryAnalyzer -> target/flaky-tests.txt).
# A few are tolerated but always reported; more than this blocks the merge.
gate.maxFlaky=3

# Modules that MUST report results on a pull request. A missing module = gate failure (prevents "green because
# nothing ran"). Nightly runs add 09-mobile via: --set gate.requiredModules=...
gate.requiredModules=02-cross-browser-ui,03-api-testing,04-e2e-framework,05-performance,06-security-qa,07-accessibility,08-db-migration,10-quality-gate

# Minimum executed tests per required module
gate.minTestsPerModule=1
